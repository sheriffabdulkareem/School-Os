<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SchoolOS — modern school management system.">
    <title>Login — SchoolOS</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- SchoolOS CSS: keep these files separated by responsibility -->
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- =====================================================
     AUTHENTICATION PAGE
     Frontend only for now. Connect this form to the
     backend authentication API later.
     ===================================================== -->
<main class="min-vh-100 d-flex align-items-center py-5" style="background:var(--color-hero-start);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="about-card shadow-sm">
                    <div class="text-center mb-4">
                        <a class="navbar-brand justify-content-center" href="index.html">
                            <span class="brand-icon"><i class="bi bi-mortarboard-fill"></i></span>
                            School<span style="color:var(--color-primary);">OS</span>
                        </a>
                        <h2 class="mt-4" style="color:var(--color-heading);font-weight:800;">Login</h2>
                        <p>Manage your school from one place.</p>
                    </div>

                    <form id="authForm">
                        <div id="formMessage" class="alert d-none"></div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input id="email" name="email" type="email" class="form-control" placeholder="admin@school.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input id="password" name="password" type="password" class="form-control" placeholder="Enter password" required>
                        </div>
                        <button id="submitBtn" type="submit" class="primary-btn w-100 justify-content-center">Login</button>
                    </form>

                    <p class="text-center mt-4 mb-0">New school? <a href="register.html">Create an account</a></p>
                    <p class="text-center mt-3"><a href="index.html">← Back to SchoolOS</a></p>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
document.getElementById("authForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const message = document.getElementById("formMessage");
    const button = document.getElementById("submitBtn");
    button.disabled = true; button.textContent = "Logging in...";
    try {
        const response = await fetch("/api/auth/login", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(Object.fromEntries(new FormData(this))) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Login failed.");
        window.location.href = data.redirect || "/dashboard.html";
    } catch (error) {
        message.className = "alert alert-danger"; message.textContent = error.message;
    } finally { button.disabled = false; button.textContent = "Login"; }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
